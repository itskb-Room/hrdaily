<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102f55">
  <title>HR Daily Report</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, #eef6ff, #f7fbff 50%, #e9f7f1);
      color: #17324d;
      font: 16px/1.6 "Noto Sans Thai", "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 460px);
      padding: 32px 26px;
      border: 1px solid #dfe8f1;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(16, 47, 85, .12);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #102f55;
      color: #fff;
      font-size: 22px;
      font-weight: 800;
    }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 8px 0 22px; color: #718398; }
    a {
      display: block;
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: #1976ed;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    small { display: block; margin-top: 16px; color: #8a9bad; }
  </style>
</head>
<body>
  <main>
    <div class="logo">HR</div>
    <h1>HR Daily Report</h1>
    <p>กำลังเปิดระบบรายงานกำลังคนประจำวัน</p>
    <a id="openApp" href="https://script.google.com/a/macros/songkhlabiomass.co.th/s/AKfycbyP0ZcNvrxmvxC83IvY01-pNI2-2w4Bg_ebNU6NnlcMmDNmsBDaXca4l3k9e1gCWiyr/exec">เปิดระบบ HR Daily</a>
    <small>หากระบบไม่เปิดอัตโนมัติ กรุณากดปุ่มด้านบนและเข้าสู่ระบบด้วยบัญชีบริษัท</small>
  </main>
  <script>
    window.setTimeout(function () {
      window.location.replace(document.getElementById('openApp').href);
    }, 300);
  </script>
</body>
</html>
